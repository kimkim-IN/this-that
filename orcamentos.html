<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Orçamentos | Rota Livre Viagens</title>
    <link rel="stylesheet" href="style.css">
    <script src="orcamentos.js" defer></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>Rota Livre Viagens</h1>
            <p>Escolha seu próximo destino e comece a planejar sua viagem.</p>
        </div>
    </header>

    <nav>
        <div class="container">
            <a href="index.html#inicio">Início</a>
            <a href="index.html#destinos">Destinos</a>
            <a href="index.html#contato">Contato</a>
            <a href="orcamentos.html" aria-current="page">Simulador</a>
        </div>
    </nav>

    <main class="container">
        <section id="simulador" class="simulador">
            <h2>Simule sua viagem</h2>
            <form id="form-orcamento">
                <label for="nome">Nome do viajante:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="destino">Destino:</label>
                <select id="destino" name="destino" required>
                    <option value="">Selecione um destino</option>
                    <option value="paris">Paris</option>
                    <option value="florianopolis">Florianópolis</option>
                    <option value="foz">Foz do Iguaçu</option>
                </select>

                <label for="quantidade">Quantidade de viajantes:</label>
                <input type="number" id="quantidade" name="quantidade" min="1" step="1" required>

                <button type="submit">Calcular estimativa</button>
            </form>
            <p id="resultado" aria-live="polite"></p>
        </section>
    </main>
</body>
</html>
